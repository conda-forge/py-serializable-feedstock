# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.2.0"
  python_check_max: "3.15"

package:
  name: py-serializable
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/py-serializable/py_serializable-${{ version }}.tar.gz
  sha256: 8e4fa02e8de819c0488ccdb69c2d3109274adcf224c02357fd8729cb12727aab

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - pip
    - poetry-core >=1.8.1
    - python ${{ python_min }}.*
  run:
    - defusedxml >=0.7.1,<0.8.0
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/py-serializable/**
      site_packages:
        - py_serializable/**
        - py_serializable-${{ version }}.dist-info/**
  - python:
      pip_check: true
      imports: py_serializable
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - tests/**
    requirements:
      run:
        - coverage
        - lxml
        - mypy
        - pytest
        - xmldiff
        - python ${{ python_min }}.*
    script:
      - mypy -p py_serializable
      - coverage run --source=py_serializable --branch -m pytest -vv --color=yes --tb=long
      - coverage report --show-missing --skip-covered --fail-under=82

about:
  summary: Library for serializing and deserializing Python Objects to and from JSON and XML.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/madpah/serializable
  documentation: https://py-serializable.readthedocs.io

extra:
  recipe-maintainers:
    - bollwyvl
